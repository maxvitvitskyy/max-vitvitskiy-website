<style>

@font-face{font-family:"Moniqa";src:url("../fonts/Moniqa-MediumItalicDisplay.woff2") format("woff2");font-style:italic}

*{margin:0;box-sizing:border-box}
body{width:1200px;height:630px;overflow:hidden;position:relative;background:

.aur{position:absolute;left:-10%;right:-10%;top:-8%;bottom:20%;filter:blur(30px);mix-blend-mode:screen;
  background:linear-gradient(100deg,transparent 14%,rgba(255,166,48,.20) 28%,transparent 42%),
  linear-gradient(80deg,transparent 56%,rgba(41,155,150,.14) 68%,transparent 80%),
  linear-gradient(84deg,transparent 36%,rgba(150,40,70,.22) 48%,transparent 60%)}
.art{--aw:270px;position:absolute;left:465px;top:52px;width:var(--aw);height:409px}

.arch{position:absolute;inset:5% 0 0 0;border-radius:999px 999px 0 0;background:linear-gradient(to bottom,#ece8e0 0%,#e3c985 20%,#d29a2a 45%,#c8641c 72%,#9b2e20 100%)}
.arch::after{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(0deg,rgba(1,17,10,.0),transparent)}
svg.at{position:absolute;left:-22.22%;top:-9.67%;width:144.44%;height:106.33%;overflow:visible}
svg.at text{font-family:"Moniqa",serif;font-size:6.2px;text-transform:uppercase;fill:none;stroke:rgba(252,222,156,.85);stroke-width:.2}
.name{position:absolute;z-index:3;left:50%;top:62%;transform:translateX(-50%);font-family:"BazaART","Moniqa",serif;font-weight:400;font-size:182px;line-height:.9;white-space:nowrap;padding:.04em .06em .24em;
  background:linear-gradient(180deg,#f8ecd6 0%,#f3dca1 45%,#eba94b 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.fig{position:absolute;z-index:2;left:-5%;right:5%;margin-inline:auto;top:43px;height:654px;filter:drop-shadow(0 18px 40px rgba(0,0,0,.5));
}
.shade{position:absolute;left:0;right:0;bottom:0;height:260px;z-index:3;background:linear-gradient(0deg,rgba(13,13,12,.7) 0%,rgba(13,13,12,.4) 45%,rgba(13,13,12,0) 100%)}
.copy{position:absolute;z-index:4;left:0;right:0;bottom:24px;text-align:center;font-family:"Moniqa Text","Moniqa",Georgia,serif;font-size:30px;line-height:1.3;max-width:900px;text-wrap:balance;margin:auto;text-shadow:none}
.copy em{white-space:nowrap;font-family:"Moniqa",serif;font-style:italic;color:#FFA630}
</style>
<div class="aur"></div>
<div class="art">
  <div class="arch"></div>
  <svg class="at" viewBox="-16 -16 104 116"><defs><path id="p" d="M-7,72 L-7,36 A43,43 0 0 1 79,36 L79,72" fill="none"/></defs>
  <text><textPath href="#p" textLength="203" lengthAdjust="spacing" startOffset="1">· Художник · Experience-дизайнер · Креативний ментор ·</textPath></text></svg>
  <img class="fig" src="../img/hero.png">

</div>
<div class="shade"></div>
<p class="copy">Я створюю мистецтво, проєктую досвіди, що об’єднують людей, і допомагаю розкривати <em>творчий потенціал</em>.</p>
